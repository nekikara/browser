<!DOCTYPE html>
<meta name=lp-mode content=test>
<script src="../testing.js"></script>

<!-- removed while its src is still loading: the parent's load event must not
     keep waiting on it -->
<iframe id=hanging src="/xhr/hang"></iframe>
<script id=removed_while_loading>
  const hanging = document.getElementById('hanging');
  hanging.remove();
  testing.expectEqual(null, hanging.contentWindow);
  testing.expectEqual(0, window.length);

  // only complete once nothing delays the load event anymore
  testing.onload(() => testing.expectEqual('complete', document.readyState));
</script>

<script id=discards_context type=module>
  {
    // other tests' iframes come and go concurrently, so look for ours
    const frames = () => Array.from({ length: window.length }, (_, i) => window[i]);

    const state = await testing.async();

    window.ticks = 0;
    const f = document.createElement('iframe');
    f.srcdoc = '<script>setInterval(() => parent.ticks += 1, 5)<\/script>';
    f.onload = () => {
      const win = f.contentWindow;
      const doc = f.contentDocument;
      const listed = frames().includes(win);
      f.remove();
      const ticks = window.ticks;
      setTimeout(() => state.resolve({ win, doc, listed, ticks }), 50);
    };
    document.body.appendChild(f);

    await state.done(({ win, doc, listed, ticks }) => {
      testing.expectEqual(true, listed);
      testing.expectEqual(null, f.contentWindow);
      testing.expectEqual(null, f.contentDocument);
      testing.expectEqual(null, doc.defaultView);
      testing.expectEqual(true, win.closed);
      testing.expectEqual(false, frames().includes(win));
      testing.expectEqual(ticks, window.ticks);
      // the document itself is still usable
      testing.expectEqual('BODY', doc.body.tagName);
    });
  }
</script>

<script id=reinsert_loads_new_document type=module>
  {
    const state = await testing.async();

    const f = document.createElement('iframe');
    f.srcdoc = '<p>doc</p>';
    const docs = [];
    f.onload = () => {
      docs.push(f.contentDocument);
      if (docs.length === 1) {
        f.remove();
        document.body.appendChild(f);
      } else {
        state.resolve();
      }
    };
    document.body.appendChild(f);

    await state.done(() => {
      testing.expectEqual(2, docs.length);
      testing.expectEqual(false, docs[0] === docs[1]);
      testing.expectEqual(null, docs[0].defaultView);
      testing.expectEqual(f.contentWindow, docs[1].defaultView);
      testing.expectEqual('doc', docs[1].querySelector('p').textContent);
    });
  }
</script>

<script id=removing_ancestor_discards_descendants type=module>
  {
    const state = await testing.async();

    const wrapper = document.createElement('div');
    const f = document.createElement('iframe');
    f.srcdoc = '<iframe srcdoc="<p>inner</p>"></iframe>';
    f.onload = () => {
      const outer = f.contentWindow;
      const inner = outer[0];
      const inner_doc = inner.document;
      wrapper.remove();
      state.resolve({ outer, inner, inner_doc });
    };
    wrapper.appendChild(f);
    document.body.appendChild(wrapper);

    await state.done(({ outer, inner, inner_doc }) => {
      testing.expectEqual(null, f.contentWindow);
      testing.expectEqual(true, outer.closed);
      testing.expectEqual(true, inner.closed);
      testing.expectEqual(null, inner_doc.defaultView);
    });
  }
</script>

<script id=interval_removes_own_iframe type=module>
  {
    const state = await testing.async();

    window.self_removals = 0;
    const f = document.createElement('iframe');
    f.srcdoc = '<script>setInterval(() => { parent.self_removals += 1; frameElement.remove(); }, 5)<\/script>';
    document.body.appendChild(f);

    // wait for the first tick however long the load takes, then leave room
    // for a second one that must not come
    const poll = () => window.self_removals > 0 ? setTimeout(() => state.resolve(), 50) : setTimeout(poll, 5);
    poll();

    await state.done(() => {
      testing.expectEqual(1, window.self_removals);
      testing.expectEqual(null, f.contentWindow);
    });
  }
</script>

<script id=clear_timer_on_discarded_window type=module>
  {
    const state = await testing.async();

    const f = document.createElement('iframe');
    f.srcdoc = '<script>window.timer_id = setInterval(() => {}, 5)<\/script>';
    f.onload = () => {
      const win = f.contentWindow;
      f.remove();
      // the timer was dropped with the scheduler, clearing it must be a no-op
      win.clearInterval(win.timer_id);
      win.clearTimeout(win.timer_id);
      state.resolve(win);
    };
    document.body.appendChild(f);

    await state.done((win) => {
      testing.expectEqual(true, win.closed);
    });
  }
</script>

<!-- removed by its own window load handler: discard already released the
     parent, the rest of the load steps must not notify it again -->
<script id=removed_by_own_load_handler type=module>
  {
    const state = await testing.async();

    const f = document.createElement('iframe');
    window.removeLoadingFrame = () => {
      f.remove();
      setTimeout(() => state.resolve(), 10);
    };
    f.srcdoc = '<script>onload = () => parent.removeLoadingFrame();<\/script>';
    document.body.appendChild(f);

    await state.done(() => {
      delete window.removeLoadingFrame;
      testing.expectEqual(null, f.contentWindow);
    });
  }
</script>

<!-- a removed iframe's context is retired, so it no longer counts against
     Env's MAX_CONTEXTS (128 outside of WPT builds) -->
<script id=removed_frames_release_their_context type=module>
  {
    const state = await testing.async();

    let loaded = 0;
    for (let i = 0; i < 200; i++) {
      const f = document.createElement('iframe');
      f.srcdoc = '<p>child</p>';
      await new Promise((resolve) => {
        f.onload = resolve;
        document.body.appendChild(f);
      });
      if (f.contentDocument.querySelector('p').textContent === 'child') {
        loaded += 1;
      }
      f.remove();
    }
    state.resolve(loaded);

    await state.done((loaded) => {
      testing.expectEqual(200, loaded);
    });
  }
</script>

<!-- the Window of a retired context is still usable from JS -->
<script id=retired_window_stays_usable type=module>
  {
    const state = await testing.async();

    const f = document.createElement('iframe');
    f.srcdoc = '<script>window.answer = 42; window.timer_id = setInterval(() => {}, 5)<\/script>';
    f.onload = () => {
      const win = f.contentWindow;
      const doc = f.contentDocument;
      f.remove();
      // use it from a later task, not the one that removed it
      setTimeout(() => state.resolve({ win, doc }), 10);
    };
    document.body.appendChild(f);

    await state.done(({ win, doc }) => {
      testing.expectEqual(true, win.closed);
      testing.expectEqual(42, win.answer);
      testing.expectEqual(doc, win.document);
      testing.expectEqual(null, doc.defaultView);
      win.clearInterval(win.timer_id);
      testing.expectEqual('P', doc.createElement('p').tagName);
    });
  }
</script>

<!-- a removed iframe's promise jobs still run (e.g. its streams keep working),
     only its tasks don't -->
<script id=retired_context_runs_microtasks type=module>
  {
    const state = await testing.async();

    const f = document.createElement('iframe');
    f.srcdoc = '<p>child</p>';
    f.onload = () => {
      const win = f.contentWindow;
      // the reaction is the iframe's, so its job goes to the iframe's queue
      const resolve = win.eval('let r; window.p = new Promise((res) => r = res).then((x) => x + 1); r');
      const p = win.p;
      f.remove();
      resolve(41);
      p.then((v) => state.resolve(v));
    };
    document.body.appendChild(f);

    await state.done((v) => {
      testing.expectEqual(42, v);
    });
  }
</script>

<!-- tasks queued for a removed iframe after its removal don't run either -->
<script id=retired_context_drops_later_tasks type=module>
  {
    const state = await testing.async();

    const f = document.createElement('iframe');
    f.srcdoc = '<script>onmessage = () => parent.retired_ran.push("message")<\/script>';
    f.onload = () => {
      window.retired_ran = [];
      const win = f.contentWindow;
      f.remove();
      win.setTimeout(() => window.retired_ran.push('timeout'), 0);
      win.postMessage('x', '*');
      // a timer the removed iframe sets itself, from one of its promise jobs
      win.eval('Promise.resolve().then(() => setTimeout(() => parent.retired_ran.push("own timeout"), 0))');
      setTimeout(() => state.resolve(window.retired_ran), 20);
    };
    document.body.appendChild(f);

    await state.done((ran) => {
      testing.expectEqual('[]', JSON.stringify(ran));
    });
  }
</script>

<!-- promise jobs keep their order across contexts when an iframe is removed:
     neither another iframe's job (queued before) nor the removed iframe's job
     (queued by the parent) is pushed past the next task -->
<script id=retire_keeps_microtask_order type=module>
  {
    const state = await testing.async();

    const addFrame = () => new Promise((resolve) => {
      const f = document.createElement('iframe');
      f.srcdoc = '<p>c</p>';
      f.onload = () => resolve(f);
      document.body.appendChild(f);
    });
    const a = await addFrame();
    const b = await addFrame();
    const c = await addFrame();

    const log = [];
    window.order_log = log;
    window.order_remove_a = () => {
      a.remove();
      log.push('a removed');
    };
    // c's reaction, triggered by the parent once c is removed
    const resolve_c = c.contentWindow.eval('let r; new Promise((res) => r = res).then(() => parent.order_log.push("c job")); r');
    setTimeout(() => {
      a.contentWindow.eval('Promise.resolve().then(() => parent.order_remove_a())');
      b.contentWindow.eval('Promise.resolve().then(() => parent.order_log.push("b job"))');
      c.remove();
      Promise.resolve().then(() => resolve_c());
    }, 0);
    setTimeout(() => log.push('next task'), 0);
    setTimeout(() => state.resolve(log), 20);

    await state.done((log) => {
      testing.expectEqual('["a removed","b job","c job","next task"]', JSON.stringify(log));
    });
  }
</script>

<!-- a removed iframe's dedicated workers go with it -->
<script id=removed_frames_release_their_workers type=module>
  {
    const state = await testing.async();

    let loaded = 0;
    for (let i = 0; i < 200; i++) {
      const f = document.createElement('iframe');
      f.srcdoc = '<script>window.worker = new Worker("data:text/javascript,")<\/script>';
      await new Promise((resolve) => {
        f.onload = resolve;
        document.body.appendChild(f);
      });
      if (f.contentWindow.worker instanceof f.contentWindow.Worker) {
        loaded += 1;
      }
      f.remove();
    }
    state.resolve(loaded);

    await state.done((loaded) => {
      testing.expectEqual(200, loaded);
    });
  }
</script>
